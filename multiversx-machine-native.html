<!DOCTYPE html>
<html lang="fr" class="intro-on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Finance Computer : l'économie machine-native sur MultiversX</title>
<meta name="description" content="Le Finance Computer (MultiversX, xMoney, xPortal) face à l'économie machine-native décrite par BlackRock : une page interactive, en français et en anglais.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F6; --bg-2:#E8ECEE; --surface:#FFFFFF; --ink:#05080B; --ink-2:#4B5661; --rule:#CDD4D9;
  --teal:#00897B; --teal-soft:rgba(0,137,123,.12); --violet:#05080B; --violet-soft:rgba(5,8,11,.07);
  --amber:#05080B; --amber-soft:rgba(0,137,123,.3); --glow:0;
  --display:'Sora','Segoe UI',system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#05080B; --bg-2:#0A0F13; --surface:#10161B; --ink:#F2F7F8; --ink-2:#8C9AA5; --rule:#1F2A31;
  --teal:#23F7DD; --teal-soft:rgba(35,247,221,.12); --violet:#F2F7F8; --violet-soft:rgba(242,247,248,.08);
  --amber:#FFFFFF; --amber-soft:rgba(35,247,221,.34); --glow:1;}}
:root[data-theme="dark"]{
  --bg:#05080B; --bg-2:#0A0F13; --surface:#10161B; --ink:#F2F7F8; --ink-2:#8C9AA5; --rule:#1F2A31;
  --teal:#23F7DD; --teal-soft:rgba(35,247,221,.12); --violet:#F2F7F8; --violet-soft:rgba(242,247,248,.08);
  --amber:#FFFFFF; --amber-soft:rgba(35,247,221,.34); --glow:1;}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;overflow-x:clip}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);line-height:1.55;overflow-x:clip}
a{color:var(--teal)} button{font-family:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(1.1rem,4vw,2.5rem)}
h1,h2,h3{margin:0;line-height:1.06;letter-spacing:-0.025em}
h2{font-size:clamp(2rem,5vw,3.5rem);font-weight:700;max-width:17ch}
.kicker{font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,2vw,1.3rem);color:var(--ink-2);margin:0 0 1rem}
.sub{color:var(--ink-2);font-size:clamp(1.02rem,1.6vw,1.15rem);max-width:58ch;margin:1.2rem 0 0;font-weight:300}
section{position:relative;padding:clamp(5rem,11vw,8.5rem) 0;overflow-x:clip}
.alt{background:var(--bg-2)}
.pill{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:.5rem .95rem;font-size:.85rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem}
.pill[aria-pressed="true"]{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.cta{display:inline-flex;align-items:center;gap:.6rem;padding:.9rem 1.5rem;border-radius:999px;background:var(--teal);color:var(--bg);font-weight:700;text-decoration:none;border:0;cursor:pointer;font-size:1rem;box-shadow:0 0 calc(40px*var(--glow)) var(--teal-soft)}
.box{border:1px solid var(--rule);border-radius:22px;background:var(--surface);overflow:hidden}

#prog{position:fixed;left:0;top:0;height:3px;width:0;background:var(--teal);z-index:30}
.rail{position:fixed;left:1.2rem;top:50%;transform:translateY(-50%);z-index:20;display:none;flex-direction:column;gap:.9rem}
@media (min-width:1300px){.rail{display:flex}}
.rail a{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink-2);font-size:.75rem;font-weight:600}
.rail a i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink-2);transition:all .3s}
.rail a span{opacity:0;transition:opacity .25s}
.rail:hover a span,.rail a.on span{opacity:1}
.rail a.on{color:var(--teal)} .rail a.on i{background:var(--teal);border-color:var(--teal);transform:scale(1.3)}

/* ===== HERO ===== */
.hero{position:relative;min-height:max(100svh,940px);display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 clamp(1.5rem,3.5vw,2.5rem);overflow:hidden;--hv:0}
#net{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) calc(var(--hv)*88%),transparent) 0%,color-mix(in srgb,var(--bg) calc(var(--hv)*60%),transparent) 50%,transparent 75%),linear-gradient(180deg,transparent 75%,var(--bg) 100%)}
.hero-inner{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:clamp(1.5rem,3vw,3rem);align-items:end;width:100%}
.hero h1{font-size:clamp(2.2rem,4.3vw,4rem);font-weight:800;max-width:13ch;letter-spacing:-0.045em}
.hero .kicker{max-width:44ch}
.found{max-width:46ch;margin:1rem 0 0;font-size:.95rem;font-weight:600;color:var(--ink-2)}
.found b{color:var(--ink)} .found em{font-style:normal;color:var(--teal)}
.hud{display:flex;gap:clamp(1.2rem,3vw,2.4rem);flex-wrap:wrap;margin-top:1.5rem}
.hud b{display:block;font-size:clamp(1.4rem,2.8vw,2rem);font-weight:800;font-variant-numeric:tabular-nums;color:var(--teal);letter-spacing:-0.02em}
.hud span{font-size:.78rem;color:var(--ink-2)}
.game{background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--rule);border-radius:20px;padding:1rem 1.1rem;backdrop-filter:blur(10px)}
.game-top b{display:block;font-size:1.05rem}
.game-top span{display:block;font-size:.8rem;color:var(--ink-2);margin-top:.2rem}
.levels{list-style:none;margin:.7rem 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
@media (max-width:420px){.levels{grid-template-columns:1fr}}
.levels li{min-width:0}
.lv{width:100%;height:100%;display:grid;grid-template-columns:22px 1fr;gap:.2rem .6rem;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--bg-2);border-radius:12px;padding:.45rem .7rem;cursor:pointer;transition:border-color .2s}
.lv:hover{border-color:var(--teal)}
.lv .ic{grid-row:span 3;align-self:start;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;border:1.5px solid var(--ink-2);color:var(--ink-2)}
.lv .nm{font-weight:700;font-size:.86rem;line-height:1.2}
.lv .nm small{display:block;font-weight:400;font-size:.66rem;color:var(--ink-2);line-height:1.25}
.lv .am{font-weight:800;font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.lv .pb{grid-column:2;height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
.lv .pb i{display:block;height:100%;width:0;background:var(--teal);transition:width .15s linear}
.lv.ok{border-color:color-mix(in srgb,var(--teal) 55%,transparent)}
.lv.ok .ic{background:var(--teal);border-color:var(--teal);color:#05080B}
.lv.ok .am{color:var(--teal)}
.lv.next .ic{border-color:var(--teal);color:var(--teal);animation:blink 1.2s infinite}
.game-bot{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.8rem}
.game-bot .cta{padding:.65rem 1.1rem;font-size:.9rem}
.game-note{font-size:.68rem;color:var(--ink-2);margin:.6rem 0 0}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 1.2rem);transform:translate(-50%,-20px);opacity:0;transition:all .5s;background:var(--surface);border:1px solid var(--teal);color:var(--ink);padding:.7rem 1.1rem;border-radius:16px;font-weight:600;font-size:.9rem;z-index:5;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes blink{50%{opacity:.3}}
@media (max-width:900px){
  .toast{font-size:.78rem;padding:.5rem .8rem}
  .hero{min-height:auto;padding-top:48svh}
  #net{height:50svh;bottom:auto}
  .veil{height:50svh;bottom:auto;background:linear-gradient(180deg,transparent 70%,var(--bg) 100%)}
  .hero-inner{grid-template-columns:1fr}
}

/* ===== CLOCK ===== */
.band{padding:clamp(3.5rem,8vw,6rem) 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.band .big{font-size:clamp(2.2rem,8vw,6.6rem);font-weight:800;letter-spacing:-0.05em;font-variant-numeric:tabular-nums;line-height:1;color:var(--teal);white-space:nowrap}
.band p{max-width:62ch;color:var(--ink-2);margin:1rem 0 0}

/* ===== TEMPO ===== */
#ekg{display:block;width:100%;height:180px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.1rem 1.4rem;border-top:1px solid var(--rule)}
.reads{display:flex;gap:2rem;flex-wrap:wrap}
.reads b{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums}
.reads span{display:block;font-size:.8rem;color:var(--ink-2)}
.switch{display:flex;align-items:center;gap:.8rem;background:none;border:1px solid var(--rule);padding:.4rem .5rem .4rem 1rem;border-radius:999px;cursor:pointer;font-size:.95rem;font-weight:700}
.knob{width:54px;height:30px;border-radius:999px;background:var(--bg-2);position:relative}
.knob::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--ink-2);transition:transform .35s cubic-bezier(.5,1.6,.4,1)}
.switch[aria-checked="true"] .knob{background:var(--teal-soft)}
.switch[aria-checked="true"] .knob::after{transform:translateX(24px);background:var(--teal)}
.race{margin-top:1.25rem;padding:1.4rem}
.race h3{font-size:1.15rem;font-weight:700}
.race>p{margin:.35rem 0 1.2rem;color:var(--ink-2);font-size:.95rem}
.lane{display:grid;grid-template-columns:170px 1fr 92px;gap:1rem;align-items:center;margin:.75rem 0}
@media (max-width:600px){.lane{grid-template-columns:1fr 70px}.lane .track{grid-column:1/-1;grid-row:2}}
.lane .nm{font-size:.85rem;font-weight:600}
.lane .nm small{display:block;font-weight:400;color:var(--ink-2);font-size:.72rem}
.track{height:14px;border-radius:999px;background:var(--bg-2);overflow:hidden;position:relative}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:var(--ink-2)}
.lane.f .fill{background:var(--teal)}
.lane .t{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;font-size:.9rem}
.lane.f .nm,.lane.f .t{color:var(--teal)}
.verdict{font-size:.95rem;color:var(--teal);font-weight:600}
.logbar{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:.8rem;flex-wrap:wrap}

/* ===== USE CASES (HUB) ===== */
.os{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:2.2rem}
@media (max-width:760px){.os{grid-template-columns:1fr}}
.osb{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:18px;padding:1rem 1.1rem;cursor:pointer}
.osb b{display:block;font-size:1.15rem}
.osb span{font-size:.85rem;color:var(--ink-2)}
.osb[aria-pressed="true"]{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.osb[aria-pressed="true"] b{color:var(--teal)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem;margin-top:1rem}
.uc{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:16px;padding:.95rem 1rem;cursor:pointer;display:flex;flex-direction:column;gap:.35rem;transition:transform .2s,border-color .2s;min-height:160px}
.uc:hover{transform:translateY(-3px);border-color:var(--teal)}
.uc[aria-pressed="true"]{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.uc .ic{font-size:1.35rem;line-height:1}
.uc h3{font-size:1rem;font-weight:700;letter-spacing:-0.01em}
.uc p{margin:0;font-size:.84rem;color:var(--ink-2);flex:1}
.uc .meta{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;font-weight:700}
.uc .sec{color:var(--ink-2)}
.st{padding:.12rem .5rem;border-radius:999px}
.st.ok{background:var(--teal-soft);color:var(--teal)}
.st.v{background:none;color:var(--ink-2);border:1px dashed var(--ink-2)}
.uc.hide{display:none}
.theatre{margin-top:1.6rem;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:1.1rem;scroll-margin-top:1rem}
@media (max-width:920px){.theatre{grid-template-columns:1fr}}
.scene svg{display:block;width:100%;height:auto}
.hub-legend{display:flex;gap:1.2rem;flex-wrap:wrap;padding:.8rem 1.2rem;border-top:1px solid var(--rule);font-size:.78rem;color:var(--ink-2)}
.hub-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.35rem;vertical-align:-1px}
.scene-hud{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;padding:.9rem 1.2rem;border-top:1px solid var(--rule);font-size:.76rem;color:var(--ink-2)}
@media (max-width:600px){.scene-hud{grid-template-columns:1fr 1fr}}
.scene-hud b{display:block;font-size:1.15rem;color:var(--ink);font-variant-numeric:tabular-nums}
.scene-hud div:nth-child(3) b{color:var(--teal)}
/* svg classes */
.act{fill:var(--surface);stroke:var(--rule);stroke-width:1.5;transition:stroke .3s}
.act.hot{stroke:var(--teal);stroke-width:3}
.albl{font-size:15px;font-weight:700;fill:var(--ink)}
.asub{font-size:12px;fill:var(--ink-2)}
.spoke{stroke:var(--rule);stroke-width:1.3;stroke-dasharray:3 6;fill:none}
.r-portal,.r-money{fill:none;stroke:var(--rule);stroke-width:18;transition:stroke .35s}
.r-portal.lit{stroke:color-mix(in srgb,var(--ink) 22%,transparent)}
.r-money.lit{stroke:var(--amber-soft)}
.r-core{fill:var(--teal-soft);stroke:var(--teal);stroke-width:2}
.r-core.lit{fill:var(--teal);}
.rl{font-size:10.5px;font-weight:700;fill:var(--ink-2);letter-spacing:.02em}
.rl.lit-p{fill:var(--ink)} .rl.lit-m{fill:var(--teal)}
.core-t{font-size:18px;font-weight:800;fill:var(--ink)}
.core-s{font-size:11px;font-weight:600;fill:var(--ink-2)}
.r-core.lit ~ .core-t{fill:var(--bg)}
.amt{font-size:13px;font-weight:800;fill:var(--teal)}
.amt.v{fill:var(--violet)}
.settle{font-size:12px;font-weight:800;fill:var(--bg)}
@media (max-width:600px){.albl{font-size:22px}.asub{font-size:17px}.amt{font-size:20px}.rl{font-size:14px}.core-t{font-size:20px}.core-s{font-size:15px}.settle{font-size:17px}}
.log{padding:1.25rem 1.3rem;display:flex;flex-direction:column;min-height:360px}
.log h3{font-size:1.2rem;font-weight:700}
.goal{font-family:var(--serif);font-style:italic;color:var(--ink-2);margin:.2rem 0 1rem}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem;flex:1}
.log li{display:grid;grid-template-columns:auto 1fr;gap:.7rem;opacity:.28;transition:opacity .45s}
.log li.in{opacity:1}
.log li i{margin-top:.4rem;width:10px;height:10px;border-radius:50%;background:var(--rule)}
.log li.in i{background:var(--teal)}
.log li.in.v i{background:none;border:2px dashed var(--ink)}
.log li p{margin:0;font-size:.9rem}
.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:.06rem .5rem;border-radius:999px;margin:.3rem .3rem 0 0;background:var(--teal-soft);color:var(--teal)}
.tag.v{background:none;color:var(--ink-2);border:1px dashed var(--ink-2)}
.note{font-size:.76rem;color:var(--ink-2)}

/* ===== ANATOMY ===== */
.compose{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2.5rem;position:relative;min-height:230px}
@media (max-width:760px){.compose{grid-template-columns:1fr;min-height:0}}
.piece{border:1px solid var(--rule);background:var(--surface);border-radius:22px;padding:1.4rem;transition:transform .9s cubic-bezier(.7,0,.2,1),opacity .6s .3s}
.piece .n{font-size:.8rem;color:var(--ink-2);font-weight:700}
.piece h3{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;margin:.4rem 0 .5rem}
.piece p{margin:0;color:var(--ink-2);font-size:.95rem}
.piece .who{margin-top:.8rem;font-weight:700;font-size:.85rem;color:var(--teal)}
.merged{position:absolute;inset:0;display:grid;place-items:center;text-align:center;border-radius:22px;border:2px solid var(--teal);background:radial-gradient(circle at 50% 50%,var(--teal-soft),var(--surface) 70%);opacity:0;transform:scale(.85);transition:all .7s .55s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.merged h3{font-size:clamp(2rem,5vw,3.6rem);font-weight:800;letter-spacing:-0.04em}
.merged p{margin:.4rem 0 0;color:var(--ink-2)}
.compose.on .piece:nth-child(1){transform:translateX(calc(100% + 1rem)) scale(.9);opacity:0}
.compose.on .piece:nth-child(2){transform:scale(.9);opacity:0}
.compose.on .piece:nth-child(3){transform:translateX(calc(-100% - 1rem)) scale(.9);opacity:0}
.compose.on .merged{opacity:1;transform:none}
@media (max-width:760px){.compose.on .piece:nth-child(1),.compose.on .piece:nth-child(3){transform:scale(.9)}}
.stack-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:2rem;margin-top:3rem;align-items:start}
@media (max-width:860px){.stack-grid{grid-template-columns:1fr}}
.layers{position:relative;display:flex;flex-direction:column;gap:6px}
.layer{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1rem;text-align:left;width:100%;padding:1rem 1.2rem;border:1px solid var(--rule);border-radius:14px;background:var(--surface);cursor:pointer;position:relative;overflow:hidden}
.layer b{font-size:1rem}
.layer span{font-size:.8rem;color:var(--ink-2);font-weight:600}
.layer[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.layer.ledger{background:var(--teal-soft);border-color:var(--teal)}
.beam{position:absolute;left:12px;top:0;width:3px;height:100%;pointer-events:none}
.beam i{position:absolute;left:-4px;width:11px;height:11px;border-radius:50%;background:var(--teal);box-shadow:0 0 calc(14px*var(--glow)) var(--teal);animation:drop 2.4s cubic-bezier(.6,0,.4,1) infinite}
.beam i:nth-child(2){animation-delay:.8s}.beam i:nth-child(3){animation-delay:1.6s}
@keyframes drop{0%{top:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:calc(100% - 12px);opacity:0}}
.ldet h3{font-size:1.6rem;font-weight:700}
.ldet .who{color:var(--teal);font-weight:700;margin:.3rem 0 .8rem;font-size:.9rem}
.ldet p{margin:.5rem 0;color:var(--ink-2);max-width:46ch}
.api{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-top:3rem}
@media (max-width:760px){.api{grid-template-columns:1fr 1fr}}
.mod{border:1px solid var(--rule);background:var(--surface);border-radius:16px;padding:1rem;position:relative}
.mod b{display:block;font-size:1.05rem}
.mod p{margin:.3rem 0 0;font-size:.84rem;color:var(--ink-2)}
.mod::after{content:"";position:absolute;left:50%;bottom:-.8rem;width:2px;height:.8rem;background:var(--teal)}
@media (max-width:760px){.mod::after{display:none}}
.onebal{margin-top:.8rem;border-radius:16px;padding:1rem 1.2rem;background:var(--teal);color:var(--bg);font-weight:800;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.onebal span{font-weight:600;font-size:.85rem;opacity:.85}
.partners{margin-top:2rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--ink-2)}
.partners b{color:var(--ink);font-size:1rem}

/* ===== DAY ===== */
.day{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:center;margin-top:2.5rem}
@media (max-width:860px){.day{grid-template-columns:1fr}}
.dial{width:min(100%,460px);margin:0 auto;touch-action:none;user-select:none}
.dial svg{display:block;width:100%;height:auto}
.dial .face{fill:var(--surface);stroke:var(--rule)}

/* icônes */
.ico{width:34px;height:34px;display:block;color:var(--teal)}
.ico *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.basic .ico{margin-bottom:.2rem}
/* mini chaîne de blocs */
.chainmini{display:flex;gap:6px;align-items:center;overflow:hidden;height:30px}
.chainmini{justify-content:flex-end}
.chainmini b{flex:0 0 26px;height:22px;border-radius:5px;border:1.5px solid var(--teal);background:var(--teal-soft);animation:step600 .6s cubic-bezier(.3,.8,.3,1) infinite}
.chainmini b:last-child{animation:step600 .6s cubic-bezier(.3,.8,.3,1) infinite,born .6s ease-out infinite}
@keyframes step600{from{transform:translateX(32px)}to{transform:translateX(0)}}
@keyframes born{0%{background:var(--teal);box-shadow:0 0 12px var(--teal)}100%{background:var(--teal-soft);box-shadow:none}}
/* cartes d'usage sans emoji */
.uc .num{font-size:.78rem;font-weight:800;color:var(--teal);letter-spacing:.04em}
/* scène en couches */
.stack-svg{display:block;width:100%;height:auto}
.lane-r{fill:var(--bg-2);stroke:var(--rule);stroke-width:1.5;transition:fill .3s,stroke .3s}
.lane-r.lit{stroke:var(--teal);stroke-width:2.5}
.lane-r.lit.p{fill:color-mix(in srgb,var(--ink) 12%,var(--surface))}
.lane-r.lit.m{fill:color-mix(in srgb,var(--teal) 16%,var(--surface))}
.lane-r.lit.c{fill:color-mix(in srgb,var(--teal) 28%,var(--surface))}
.lane-t{font-size:15px;font-weight:800;fill:var(--ink)}
.lane-s{font-size:11px;fill:var(--ink-2)}
.lane-cap{font-size:12.5px;font-weight:700;fill:var(--teal)}
.fc-frame{fill:none;stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:4 6}
.fc-t{font-size:12px;font-weight:800;fill:var(--ink-2);letter-spacing:.06em}
.blk{fill:var(--teal);opacity:.55}
.act{fill:var(--surface);stroke:var(--rule);stroke-width:1.5;transition:stroke .3s}
.act.hot{stroke:var(--teal);stroke-width:3}
.albl{font-size:14px;font-weight:700;fill:var(--ink)}
.asub{font-size:11px;fill:var(--ink-2)}
.amt{font-size:13px;font-weight:800;fill:var(--ink)}
@media (max-width:600px){.blk{display:none}}
@media (max-width:600px){.lane-t{font-size:20px}.lane-s{font-size:15px}.lane-cap{font-size:16px}.albl{font-size:19px}.asub{font-size:15px}.amt{font-size:18px}.fc-t{font-size:15px}}
/* couches du Finance Computer : sans faisceau, impulsion descendante */
.layer[aria-pressed="true"]{border-color:var(--teal);box-shadow:none}
.layer.pulse{background:color-mix(in srgb,var(--teal) 14%,var(--surface))}
.layer{transition:background .25s}
/* jeu d'adoption dans le chapitre 3 */
.adopt-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:1.1rem;margin-top:2rem;align-items:stretch}
@media (max-width:900px){.adopt-grid{grid-template-columns:1fr}}
.netbox{position:relative;min-height:440px}
@media (max-width:600px){.netbox{min-height:340px}}
#net2{position:absolute;inset:0;width:100%;height:100%;display:block}
.nethud{position:absolute;left:1rem;top:.9rem;right:1rem;display:flex;gap:1.4rem;flex-wrap:wrap;pointer-events:none}
.nethud b{display:block;font-size:1.35rem;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
.nethud span{font-size:.72rem;color:var(--ink-2)}
.game{background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:1.1rem 1.2rem;backdrop-filter:none}
.adopt-h{margin-top:4.5rem;font-size:clamp(1.5rem,3vw,2.1rem);font-weight:700;max-width:24ch}
.toast{position:fixed}
/* prix simulé */
.whatif{margin-top:1.1rem;padding:1.4rem}
.whatif .big{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.whatif-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.5rem;align-items:center;margin-top:1rem}
@media (max-width:800px){.whatif-grid{grid-template-columns:1fr}}
.whatif input{width:100%;accent-color:var(--teal)}
.warn{margin-top:1rem;padding:.8rem 1rem;border:1px dashed var(--ink-2);border-radius:12px;font-size:.8rem;color:var(--ink-2)}
</style>
</head>
